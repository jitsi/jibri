# Runs jibri's page objects against a real docker-jitsi-meet deployment, with real participants in the
# conference.  See doc/integration-tests.md.
name: Integration tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  call-page:
    name: CallPage
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9  # v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Start the jitsi-meet deployment
        run: ./resources/integration-tests/deployment.sh up

      - name: Run the integration tests
        run: mvn -B -Pintegration-tests test-compile failsafe:integration-test failsafe:verify

      - name: Collect the deployment logs
        if: failure()
        run: ./resources/integration-tests/deployment.sh logs 1000 > target/deployment.log

      - name: Upload the test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: integration-test-reports
          path: |
            target/failsafe-reports
            target/deployment.log
          if-no-files-found: ignore

      - name: Stop the jitsi-meet deployment
        if: always()
        run: ./resources/integration-tests/deployment.sh down
